; TSYP14 "The Living Map" — ESP8266 ESP-NOW mesh testbed (NOT production firmware).
;
;   pio run -e beacon -t upload --upload-port /dev/cu.usbserial-XXXX
;   pio run -e bridge -t upload --upload-port /dev/cu.usbserial-YYYY
;   pio run -e beacon -t erase  --upload-port ...   ; wipe stored frame -> back to provisioning
;
; Wemos D1 Mini instead of NodeMCU: change `board = d1_mini` below.

[platformio]
default_envs = beacon, bridge

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:beacon]
build_src_filter = +<beacon/>

[env:bridge]
build_src_filter = +<bridge/>
